version: "3.8"
services:
  controller:
    image: ${CONTROLLER_IMAGE:-ghcr.io/foninhoiuri/macmini_proxmox_controler:latest}
    ports:
      - target: 8787
        published: ${PORT:-8787}
        protocol: tcp
        mode: host
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Defina ADMIN_TOKEN no arquivo .env}
      PUBLIC_URL: ${PUBLIC_URL:?Defina PUBLIC_URL com o endereco do LXC}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-0}
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    volumes:
      - controller-data:/data
    read_only: true
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          memory: 256M
volumes:
  controller-data:
